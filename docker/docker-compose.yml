services:

  nodered:

    image: nodered/node-red:5.0.1

    container_name: bms-nodered

    restart: unless-stopped

    ports:

      - "127.0.0.1:1880:1880"

    volumes:

      - ../nodered:/data

      - ../config:/config:ro

      - ../drivers:/drivers:ro

      - ../logs:/logs

      - ../backups:/backups

    environment:
      TZ: America/Montevideo

      HTTP_PROXY: "http://10.0.1.32:8080"
      HTTPS_PROXY: "http://10.0.1.32:8080"

      NO_PROXY: "localhost,127.0.0.1,bms-mosquitto,bms-fuxa,bms-nginx"

      NODE_USE_ENV_PROXY: "1"

    ulimits:
      core:
        soft: 0
        hard: 0

  fuxa:

    build:

      context: ./fuxa

    image: bms-fuxa:1.3.4-rolefix1

    container_name: bms-fuxa

    restart: unless-stopped

    ports:

      - "127.0.0.1:1881:1881"

    volumes:

      - ../fuxa/appdata:/usr/src/app/FUXA/server/_appdata

      - ../fuxa/db:/usr/src/app/FUXA/server/_db

      - ../fuxa/logs:/usr/src/app/FUXA/server/_logs

      - ../fuxa/images:/usr/src/app/FUXA/server/_images

    environment:

      - TZ=America/Montevideo

    depends_on:

      - nodered

  mosquitto:

    image: eclipse-mosquitto:2.0

    container_name: bms-mosquitto

    restart: unless-stopped

    ports:
      - "127.0.0.1:1883:1883"

    volumes:
      - ../mosquitto/config:/mosquitto/config
      - ../mosquitto/data:/mosquitto/data
      - ../mosquitto/log:/mosquitto/log

    environment:
      - TZ=America/Montevideo

  nginx:

    image: nginx:stable-alpine

    container_name: bms-nginx

    restart: unless-stopped

    ports:

      - "80:80"

    volumes:

      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:

      - fuxa
